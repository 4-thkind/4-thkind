name: 🕷️ Generate Spiderman GIF

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/animation.html"

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Sync with origin
        run: git pull --rebase origin main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install system deps first
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            chromium-browser \
            libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - name: Install Node dependencies (skip Puppeteer Chrome download)
        run: npm install
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
          PUPPETEER_EXECUTABLE_PATH: "/usr/bin/chromium-browser"

      - name: Inject real GitHub contribution data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: 4-thkind
        run: node scripts/inject_real_data.js

      - name: Record animation as GIF
        env:
          PUPPETEER_EXECUTABLE_PATH: "/usr/bin/chromium-browser"
        run: node scripts/record.js

      - name: Optimize GIF (palette + frame diffing)
        run: |
          before=$(stat -c%s spiderman.gif)
          ffmpeg -v error -y -i spiderman.gif \
            -vf "palettegen=max_colors=48:stats_mode=diff" /tmp/pal.png
          ffmpeg -v error -y -i spiderman.gif -i /tmp/pal.png \
            -lavfi "paletteuse=dither=bayer:bayer_scale=5:diff_mode=rectangle:new=0" /tmp/opt.gif
          after=$(stat -c%s /tmp/opt.gif 2>/dev/null || echo 0)
          # keep the original unless the optimized file is valid AND smaller
          if [ "$after" -gt 100000 ] && [ "$after" -lt "$before" ]; then
            mv /tmp/opt.gif spiderman.gif
            echo "optimized: $before -> $after bytes"
          else
            echo "optimization skipped ($before -> $after bytes)"
          fi

      - name: Commit and push GIF
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add spiderman.gif
          git diff --staged --quiet || git commit -m "🕷️ update spiderman gif [$(date +'%Y-%m-%d')]"
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            git rebase origin/main || {
              git checkout --ours -- spiderman.gif || true
              git add spiderman.gif
              git rebase --continue
            }
          fi
          git push